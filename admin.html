<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0b">
  <title>Admin — Havën Schedule</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* ─── Admin Layout ─────────────────────────────── */
    .admin-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 28px 80px;
    }
    .admin-scroll::-webkit-scrollbar { width: 4px; }
    .admin-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 2px; }
    .admin-scroll:hover::-webkit-scrollbar-thumb { background: var(--border-color); }

    /* ─── Header ───────────────────────────────────── */
    .admin-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .admin-header-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); flex-shrink: 0;
    }
    .admin-header-info h1 {
      font-family: var(--font-serif); font-size: 1.2rem; font-weight: 500;
      letter-spacing: -0.02em; color: var(--text-primary); margin: 0;
    }
    .admin-header-info p {
      font-size: 0.72rem; color: var(--text-tertiary); margin: 1px 0 0;
    }

    /* ─── Tab Bar ──────────────────────────────────── */
    .admin-tab-bar {
      display: flex;
      gap: 2px;
      margin-bottom: 18px;
      padding: 3px;
      background: var(--surface-container);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow-x: auto;
      flex-shrink: 0;
    }
    .admin-tab-bar::-webkit-scrollbar { height: 0; }
    .admin-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 11px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-tertiary);
      font-size: 0.7rem;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-family);
      white-space: nowrap;
      transition: all var(--t-fast);
      flex-shrink: 0;
    }
    .admin-tab:hover {
      color: var(--text-secondary);
      background: var(--accent-soft);
    }
    .admin-tab.active {
      background: var(--accent);
      color: var(--text-inverse);
    }
    .admin-tab svg { flex-shrink: 0; }

    /* ─── Content Panels ───────────────────────────── */
    .admin-content { position: relative; }
    .admin-content-panel { animation: slideUp 180ms var(--curve); }
    .admin-content-panel.hidden { display: none !important; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ─── Dashboard Grid ───────────────────────────── */
    .ad-dash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 8px;
    }
    .ad-dash-card {
      background: var(--surface-container);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
    }
    .ad-dash-card.full { grid-column: 1 / -1; }
    .ad-dash-card.half { grid-column: span 2; }
    @media (max-width: 600px) { .ad-dash-card.half { grid-column: 1 / -1; } }
    .ad-dash-label {
      font-size: 0.58rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-tertiary); margin-bottom: 4px;
    }
    .ad-dash-value {
      font-size: 1.1rem; font-weight: 700; color: var(--text-primary);
      font-variant-numeric: tabular-nums;
    }
    .ad-dash-sub {
      font-size: 0.62rem; color: var(--text-tertiary); margin-top: 2px;
    }
    .ad-dash-row {
      display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center;
    }
    .ad-dash-chip {
      font-size: 0.6rem; padding: 2px 8px; border-radius: 6px;
      background: var(--accent-soft); color: var(--text-secondary);
    }
    .ad-dash-act {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 0; font-size: 0.7rem; color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .ad-dash-act:last-child { border-bottom: none; }
    .ad-dash-act-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); flex-shrink: 0;
    }
    .ad-dash-actions {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px;
    }

    /* ─── Toolbar ──────────────────────────────────── */
    .ad-toolbar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .admin-search {
      flex: 1; min-width: 120px; max-width: 220px;
      padding: 7px 12px;
      border: 1px solid var(--border-color); border-radius: 8px;
      background: var(--bg-primary); color: var(--text-primary);
      font-size: 0.78rem; font-family: var(--font-family);
      outline: none; transition: border-color var(--t-fast);
    }
    .admin-search:focus { border-color: var(--accent); }
    .admin-search::placeholder { color: var(--text-tertiary); }

    /* ─── Select ───────────────────────────────────── */
    .ad-select {
      padding: 6px 10px;
      border: 1px solid var(--border-color); border-radius: 7px;
      background: var(--bg-primary); color: var(--text-primary);
      font-size: 0.72rem; font-family: var(--font-family);
      outline: none; cursor: pointer;
    }
    .ad-select:focus { border-color: var(--accent); }

    /* ─── Table ────────────────────────────────────── */
    .ad-table-wrap {
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      overflow-x: auto;
    }
    .ad-table {
      width: 100%; border-collapse: collapse; font-size: 0.72rem;
    }
    .ad-table th {
      text-align: left; padding: 8px 10px;
      font-size: 0.6rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-tertiary);
      background: var(--surface-container-high);
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
      position: sticky; top: 0; z-index: 1;
    }
    .ad-table td {
      padding: 6px 10px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-subtle);
    }
    .ad-table tr:hover td { background: var(--accent-soft); }
    .ad-table .ad-row-done td { opacity: 0.5; text-decoration: line-through; }
    .ad-tcell-key { font-family: var(--font-mono); font-size: 0.68rem; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ad-tcell-title { font-weight: 500; color: var(--text-primary); }
    .ad-tcell-actions { display: flex; gap: 3px; }
    .ad-tcell-actions .admin-btn { padding: 2px 6px; font-size: 0.6rem; }

    /* ─── Tag chip ─────────────────────────────────── */
    .ad-tag-chip {
      display: inline-block; padding: 1px 8px; border-radius: 4px;
      font-size: 0.62rem; font-weight: 500;
      background: var(--accent-soft); color: var(--text-secondary);
    }

    /* ─── Bulk bar ─────────────────────────────────── */
    .ad-bulk-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; margin-bottom: 6px;
      background: var(--surface-container); border: 1px solid var(--border-color);
      border-radius: 8px; min-height: 32px;
    }

    /* ─── System bar rows ──────────────────────────── */
    .ad-sys-bar-row {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 0.68rem;
    }
    .ad-sys-bar-label {
      min-width: 120px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; color: var(--text-secondary); flex-shrink: 0;
    }
    .ad-sys-bar-track {
      flex: 1; height: 6px; border-radius: 3px;
      background: var(--border-subtle); overflow: hidden;
    }
    .ad-sys-bar-fill {
      height: 100%; border-radius: 3px;
      background: var(--accent); transition: width 300ms;
    }
    .ad-sys-bar-val {
      min-width: 50px; text-align: right; font-weight: 600;
      color: var(--text-primary); font-variant-numeric: tabular-nums;
    }

    /* ─── Raw input ────────────────────────────────── */
    .ad-raw-input {
      width: 100%; padding: 8px 10px; box-sizing: border-box;
      border: 1px solid var(--border-color); border-radius: 7px;
      background: var(--bg-primary); color: var(--text-primary);
      font-size: 0.78rem; font-family: var(--font-family);
      outline: none; resize: vertical;
    }
    .ad-raw-input:focus { border-color: var(--accent); }
    .ad-raw-input[readonly] {
      background: var(--surface-container); cursor: default;
    }

    /* ─── Modal ────────────────────────────────────── */
    .ad-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 10000;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; transition: opacity 180ms ease;
    }
    .ad-modal-overlay.show { opacity: 1; }
    .ad-modal {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      width: 100%; max-width: 560px;
      max-height: 80vh;
      display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      transform: translateY(16px) scale(0.97);
      transition: transform 200ms cubic-bezier(0.16,1,0.3,1);
    }
    .ad-modal-overlay.show .ad-modal {
      transform: translateY(0) scale(1);
    }
    .ad-modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }
    .ad-modal-title {
      font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
      margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ad-modal-close {
      background: none; border: none; color: var(--text-tertiary);
      cursor: pointer; padding: 4px 8px; border-radius: 6px;
      font-size: 1.2rem; line-height: 1; transition: all var(--t-fast);
    }
    .ad-modal-close:hover { background: var(--accent-soft); color: var(--text-primary); }
    .ad-modal-body {
      padding: 16px 18px; overflow-y: auto; flex: 1 1 auto;
    }
    .ad-modal-footer {
      display: flex; gap: 8px; justify-content: flex-end;
      padding: 12px 18px;
      border-top: 1px solid var(--border-subtle); flex-shrink: 0;
    }
    .ad-modal-label {
      display: block; font-size: 0.65rem; font-weight: 600;
      color: var(--text-tertiary); text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 4px;
    }

    /* ─── Swatch Preview ───────────────────────────── */
    .ad-swatch-preview { transition: background 200ms; }

    /* ─── Toast ────────────────────────────────────── */
    .admin-toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 10px 20px; border-radius: 8px;
      font-size: 0.78rem; font-weight: 500;
      background: var(--black); color: var(--white);
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 10000; pointer-events: none;
    }
    .admin-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .admin-toast.success { background: var(--accent); color: var(--text-inverse); }
    .admin-toast.error { background: var(--danger, #ef4444); color: #fff; }
    html.light .admin-toast { background: #1a1a1a; color: #fff; }
    html.light .admin-toast.success { background: #4d6356; }

    /* ─── Buttons ──────────────────────────────────── */
    .admin-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 8px;
      border: 1px solid var(--border-color);
      background: transparent; color: var(--text-secondary);
      font-size: 0.72rem; font-weight: 500; cursor: pointer;
      font-family: var(--font-family);
      transition: all var(--t-fast); white-space: nowrap;
    }
    .admin-btn:hover {
      border-color: var(--text-primary); color: var(--text-primary);
      background: var(--accent-soft);
    }
    .admin-btn.primary {
      background: var(--accent); color: var(--text-inverse);
      border-color: var(--accent);
    }
    .admin-btn.primary:hover { opacity: 0.85; }
    .admin-btn.small { padding: 4px 10px; font-size: 0.65rem; }
    .admin-btn.danger { color: var(--danger, #ef4444); }
    .admin-btn.danger:hover {
      background: color-mix(in srgb, var(--danger, #ef4444) 10%, transparent);
      border-color: var(--danger, #ef4444);
    }
    .admin-btn:disabled { opacity: 0.4; cursor: default; }

    .hidden { display: none !important; }

    /* ─── Mobile ───────────────────────────────────── */
    @media (max-width: 768px) {
      .admin-scroll { padding: 16px 14px 80px; }
      .admin-tab { padding: 5px 8px; font-size: 0.65rem; }
      .admin-tab span:not(:first-child) { display: none; }
      .ad-dash-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .ad-dash-grid { grid-template-columns: 1fr; }
      .admin-tab-bar { gap: 1px; padding: 2px; }
      .admin-tab { padding: 5px 7px; }
      .ad-table td, .ad-table th { padding: 4px 6px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>
  <!-- Ambient background -->
  <div class="hub-ambient">
    <div class="hub-ambient-gradient"></div>
    <div class="hub-ambient-dots"></div>
  </div>

  <div class="hub-sidebar-overlay" id="hubSidebarOverlay"></div>

  <div class="hub-layout">
    <!-- ─── SIDEBAR ─────────────────────────────────── -->
    <aside class="hub-sidebar" id="hubSidebar">
      <div class="hub-workspace">
        <div class="hub-workspace-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </div>
        <span class="hub-workspace-name">Admin Panel</span>
        <button class="hub-hamburger" id="hubHamburger" aria-label="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="hub-sidebar-nav" id="hubSnav">
        <a class="hub-snav-item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Hub</span>
        </a>
        <a class="hub-snav-item" href="schedule.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Schedule</span>
        </a>
        <a class="hub-snav-item" href="activities.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>Activities</span>
        </a>
        <a class="hub-snav-item" href="analytics.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Analytics</span>
        </a>
        <a class="hub-snav-item" href="goals.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
          <span>Goals</span>
        </a>
        <a class="hub-snav-item" href="finance.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
          <span>Finance</span>
        </a>
        <a class="hub-snav-item" href="gallery.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Gallery</span>
        </a>
      </div>

      <div class="hub-sidebar-footer">
        <div class="hub-footer-btns">
          <button id="themeBtnSidebar" class="btn btn-ghost" title="Theme">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <span>Theme</span>
          </button>
          <button id="aiChatBtnSidebar" class="btn btn-ghost" title="Settings">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- ─── MAIN ─────────────────────────────────────── -->
    <div class="hub-main">
      <div class="admin-scroll">

        <!-- Header -->
        <div class="admin-header">
          <div class="admin-header-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
          </div>
          <div class="admin-header-info">
            <h1>Admin</h1>
            <p>Full control panel for Havën Schedule</p>
          </div>
        </div>

        <!-- Tab Bar -->
        <div class="admin-tab-bar" id="adminTabBar"></div>

        <!-- Content Panels -->
        <div class="admin-content" id="adminContent">

          <!-- Dashboard -->
          <div class="admin-content-panel" data-panel="dashboard" id="panelDashboard"></div>

          <!-- Storage Explorer -->
          <div class="admin-content-panel hidden" data-panel="storage" id="panelStorage"></div>

          <!-- Task Manager -->
          <div class="admin-content-panel hidden" data-panel="tasks" id="panelTasks"></div>

          <!-- Data Manager -->
          <div class="admin-content-panel hidden" data-panel="data" id="panelData"></div>

          <!-- Sleep -->
          <div class="admin-content-panel hidden" data-panel="sleep" id="panelSleep"></div>

          <!-- Finance -->
          <div class="admin-content-panel hidden" data-panel="finance" id="panelFinance"></div>

          <!-- Activity -->
          <div class="admin-content-panel hidden" data-panel="activity" id="panelActivity"></div>

          <!-- AI -->
          <div class="admin-content-panel hidden" data-panel="ai" id="panelAI"></div>

          <!-- Settings -->
          <div class="admin-content-panel hidden" data-panel="settings" id="panelSettings"></div>

          <!-- System -->
          <div class="admin-content-panel hidden" data-panel="system" id="panelSystem"></div>

        </div>

      </div>
    </div>
  </div>

  <!-- Toast -->
