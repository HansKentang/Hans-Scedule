<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Havën">
  <meta name="description" content="Havën Schedule — Your personal smart scheduler.">
  <script>if (location.protocol !== 'file:') document.write('<link rel="manifest" href="manifest.json">');</script>
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>Havën</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #000;
      --bg-elevated: #0a0a0a;
      --border: rgba(255,255,255,0.08);
      --border-light: rgba(255,255,255,0.12);
      --text: #fff;
      --text-secondary: rgba(255,255,255,0.7);
      --text-tertiary: rgba(255,255,255,0.38);
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.10);
      --font-sans: 'Hanken Grotesk', system-ui, -apple-system, sans-serif;
      --font-mono: 'Space Grotesk', monospace;
      --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --smooth: cubic-bezier(0.16, 1, 0.3, 1);
    }

    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Main Grid ─── */
    .auth-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%; height: 100vh;
    }

    /* ─── Left Panel ─── */
    .auth-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 3vh, 40px) clamp(16px, 4vw, 48px);
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.7s var(--smooth) both;
    }
    .auth-left::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 50% at 30% 20%, rgba(255,255,255,0.03) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 70% 80%, rgba(255,255,255,0.02) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-left::after {
      content: ''; position: absolute; right: 0; top: 6%; bottom: 6%;
      width: 1px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16), transparent);
      pointer-events: none;
    }
    .auth-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(72px);
      pointer-events: none;
      z-index: 0;
    }
    .auth-glow-1 {
      width: 360px; height: 360px;
      top: -90px; left: -110px;
      background: radial-gradient(circle, rgba(255,255,255,0.075) 0%, transparent 65%);
      animation: glowDrift1 16s ease-in-out infinite alternate;
    }
    .auth-glow-2 {
      width: 320px; height: 320px;
      bottom: -70px; right: -90px;
      background: radial-gradient(circle, rgba(255,255,255,0.055) 0%, transparent 65%);
      animation: glowDrift2 20s ease-in-out infinite alternate;
    }

    /* ─── Corner Shapes ─── */
    .corner-shape {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    /* Top-left: quarter-circle arc */
    .corner-tl {
      top: -40px; left: -40px;
      width: 140px; height: 140px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.07);
    }
    .corner-tl::before {
      content: '';
      position: absolute;
      top: 20px; left: 20px;
      width: 100px; height: 100px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Bottom-right: quarter-circle arc */
    .corner-br {
      bottom: -50px; right: -50px;
      width: 160px; height: 160px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .corner-br::before {
      content: '';
      position: absolute;
      top: 24px; left: 24px;
      width: 112px; height: 112px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Top-right: small diamond */
    .corner-tr {
      top: 32px; right: 32px;
      width: 16px; height: 16px;
      border: 1px solid rgba(255,255,255,0.08);
      transform: rotate(45deg);
    }

    /* Bottom-left: small diamond */
    .corner-bl {
      bottom: 32px; left: 32px;
      width: 12px; height: 12px;
      border: 1px solid rgba(255,255,255,0.06);
      transform: rotate(45deg);
    }

    /* Mid-left: thin line accent */
    .corner-ml {
      top: 50%; left: 0;
      width: 40px; height: 1px;
      background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
      transform: translateY(-50%);
    }

    /* Mid-right: thin line accent */
    .corner-mr {
      top: 50%; right: 0;
      width: 40px; height: 1px;
      background: linear-gradient(270deg, rgba(255,255,255,0.1), transparent);
      transform: translateY(-50%);
    }
    @keyframes glowDrift1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(44px, 32px) scale(1.18); }
    }
    @keyframes glowDrift2 {
      0% { transform: translate(0, 0) scale(1.1); }
      100% { transform: translate(-34px, -22px) scale(0.92); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Staggered entrance */
    .auth-reveal {
      opacity: 0;
      animation: authReveal 0.7s var(--smooth) both;
      animation-delay: var(--d, 0s);
    }
    @keyframes authReveal {
      from { opacity: 0; transform: translateY(16px); filter: blur(6px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .auth-swap {
      animation: authSwap 0.45s var(--smooth);
    }
    @keyframes authSwap {
      from { opacity: 0; transform: translateY(10px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    /* ─── Form Container ─── */
    .auth-form-wrap {
      width: min(440px, 100%);
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1vh, 12px);
      position: relative;
      z-index: 1;
    }

    /* ─── Brand ─── */
    .auth-brand {
      display: flex; align-items: center; gap: clamp(8px, 1.2vw, 14px);
      margin-bottom: clamp(2px, 0.4vh, 6px);
    }
    .auth-brand-icon {
      width: clamp(30px, 4.4vh, 42px); height: clamp(30px, 4.4vh, 42px);
      border-radius: clamp(8px, 1.1vh, 11px);
      background: var(--text); color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(0.85rem, 1.2vw, 1.1rem);
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
      transition: transform 0.3s var(--bounce);
    }
    .auth-brand:hover .auth-brand-icon {
      transform: scale(1.1);
    }
    .auth-brand-icon img {
      width: 100%; height: 100%; object-fit: cover;
      display: block;
    }
    .auth-brand-icon { text-decoration: none; color: inherit; cursor: pointer; }
    .auth-brand-text { display: flex; flex-direction: column; gap: 2px; }
    .auth-brand-name {
      font-size: clamp(0.92rem, 1.3vw, 1.12rem);
      font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;
    }
    .auth-brand-tagline {
      font-size: clamp(0.6rem, 0.8vw, 0.7rem);
      color: var(--text-tertiary); font-weight: 400;
    }

    /* ─── Heading ─── */
    .auth-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(0.58rem, 0.85vw, 0.68rem);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: clamp(6px, 1vh, 10px);
    }
    .auth-eyebrow::before {
      content: '';
      width: 18px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35));
    }
    .auth-heading {
      font-size: clamp(1.4rem, 2.6vw, 1.9rem);
      font-weight: 600; line-height: 1.12;
      letter-spacing: -0.03em;
      margin-top: 0;
    }
    .auth-heading .hl-accent {
      background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.5) 50%, #fff 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: accentShimmer 7s ease-in-out infinite;
    }
    @keyframes accentShimmer {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .auth-sub {
      font-size: clamp(0.78rem, 1.1vw, 0.9rem);
      color: var(--text-tertiary);
      font-weight: 400;
      line-height: 1.5;
      margin-bottom: clamp(8px, 1.2vh, 14px);
    }

    /* ─── Glass Card ─── */
    .auth-card {
      position: relative;
      border: 1px solid var(--border);
      border-radius: clamp(16px, 2.2vh, 20px);
      background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015));
      padding: clamp(18px, 2.6vh, 26px) clamp(18px, 2.4vw, 26px);
      box-shadow: 0 24px 60px -28px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: transform 0.4s var(--smooth), box-shadow 0.4s var(--smooth), border-color 0.4s var(--smooth);
    }
    .auth-card::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 55%);
      pointer-events: none;
    }
    .auth-card:hover {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: 0 32px 72px -28px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.07);
    }

    /* ─── Footer ─── */
    .auth-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2vw, 22px);
      margin-top: clamp(10px, 1.6vh, 18px);
      font-size: clamp(0.6rem, 0.85vw, 0.68rem);
      color: var(--text-tertiary);
      font-weight: 400;
      letter-spacing: 0.04em;
    }
    .auth-footer-item {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s var(--bounce);
    }
    .auth-footer-item:hover {
      opacity: 1;
      transform: translateY(-1px);
    }
    .auth-footer-item svg { flex-shrink: 0; opacity: 0.6; transition: opacity 0.2s; }
    .auth-footer-item:hover svg { opacity: 0.85; }

    /* ─── Form inputs area ─── */
    .auth-fields {
      display: flex; flex-direction: column; gap: clamp(8px, 1.2vh, 14px);
      margin-top: 0;
    }

    /* ─── Label + Input ─── */
    .auth-input-group {
      display: flex; flex-direction: column; gap: 6px;
    }
    .auth-label {
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }
    .auth-input {
      width: 100%;
      padding: clamp(11px, 1.8vh, 15px) clamp(12px, 2.5vw, 18px);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-family: inherit;
      font-size: clamp(0.85rem, 1.2vw, 0.98rem);
      font-weight: 500;
      outline: none;
      transition: all 0.25s var(--smooth);
    }
    .auth-input::placeholder {
      color: var(--text-tertiary);
      font-weight: 400;
      opacity: 0.4;
    }
    .auth-input:hover:not(:focus) {
      border-color: var(--border-light);
    }
    .auth-input:focus {
      border-color: rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.06), 0 8px 24px -12px rgba(255,255,255,0.16);
      transform: translateY(-1px);
    }
    .auth-input.has-value { border-color: rgba(255,255,255,0.18); }
    .auth-input.invalid {
      border-color: rgba(255,120,110,0.65);
      box-shadow: 0 0 0 3px rgba(255,120,110,0.10);
      animation: shake 0.4s var(--smooth);
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .auth-label { transition: color 0.25s var(--smooth); }
    .auth-label.has-value { color: var(--text); }

    /* ─── Submit Button ─── */
    .auth-submit {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: clamp(11px, 2vh, 16px) clamp(14px, 3vw, 24px);
      border: none;
      border-radius: 11px;
      background: linear-gradient(180deg, #ffffff, #e8e8e8);
      color: var(--bg);
      font-family: inherit;
      font-size: clamp(0.82rem, 1.2vw, 0.95rem);
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: all 0.25s var(--bounce);
      margin-top: clamp(2px, 0.5vh, 6px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 4px 16px -6px rgba(255,255,255,0.25);
    }
    .auth-submit:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-2px) scale(1.01);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px -6px rgba(255,255,255,0.35);
    }
    .auth-submit:active:not(:disabled) { transform: scale(0.96); }
    .auth-submit:disabled {
      opacity: 0.2;
      cursor: default;
    }
    .auth-submit.loading { pointer-events: none; }
    .auth-submit .auth-submit-label { transition: opacity 0.2s; }
    .auth-submit.loading .auth-submit-label { opacity: 0; }

    /* ─── Divider ─── */
    .auth-divider {
      position: relative;
      text-align: center;
      margin: clamp(4px, 0.6vh, 8px) 0 clamp(2px, 0.3vh, 4px);
    }
    .auth-divider::after {
      content: ''; position: absolute; inset: 0; top: 50%;
      z-index: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 18%, var(--border) 82%, transparent);
    }
    .auth-divider span {
      position: relative; z-index: 1;
      background: #0d0d0d;
      padding: 0 12px;
      font-size: 0.66rem;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
    }

    /* ─── Google Button ─── */
    .auth-google-btn {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: clamp(8px, 1vw, 12px);
      width: 100%; padding: clamp(12px, 1.7vh, 16px) clamp(12px, 2.5vw, 18px);
      border-radius: 12px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.02));
      color: var(--text);
      font-family: inherit;
      font-size: clamp(0.82rem, 1.1vw, 0.92rem);
      font-weight: 500;
      cursor: pointer;
      overflow: hidden;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
      transition: all 0.3s var(--bounce);
    }
    .auth-google-btn:hover:not(.loading) {
      border-color: var(--border-light);
      transform: translateY(-2px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 24px -8px rgba(255,255,255,0.12);
    }
    .auth-google-btn:active:not(.loading) { transform: scale(0.97); }
    .auth-google-btn img, .auth-google-btn svg { width: 19px; height: 19px; flex-shrink: 0; }
    .auth-google-btn .auth-btn-label { transition: opacity 0.2s; }
    .auth-google-btn.loading { pointer-events: none; opacity: 0.85; }
    .auth-google-btn.loading .auth-btn-label { opacity: 0; }
    .auth-guest-btn {
      opacity: 0.85;
      font-size: clamp(0.76rem, 1vw, 0.86rem);
      padding: clamp(10px, 1.5vh, 13px);
      border-radius: 10px;
    }
    .auth-guest-btn:hover:not(.loading) {
      opacity: 1;
      border-color: var(--border-light);
      transform: translateY(-2px);
    }
    .auth-guest-btn:active:not(.loading) { transform: scale(0.97); }
    .auth-guest-btn svg { opacity: 0.6; transition: opacity 0.2s; }
    .auth-guest-btn:hover:not(.loading) svg { opacity: 0.85; }

    .auth-google-caption {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      font-size: 0.62rem;
      color: var(--text-tertiary);
      margin-top: 9px;
      letter-spacing: 0.02em;
      opacity: 0.75;
    }
    .auth-google-caption svg { flex-shrink: 0; }

    /* Spinner (shared by submit / google / guest) */
    .spinner {
      position: absolute; left: 50%; top: 50%;
      width: 17px; height: 17px;
      margin: -8.5px 0 0 -8.5px;
      border: 2px solid rgba(0,0,0,0.20);
      border-top-color: rgba(0,0,0,0.85);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      opacity: 0;
      pointer-events: none;
    }
    .loading > .spinner { opacity: 1; }
    .auth-google-btn .spinner {
      border-color: rgba(255,255,255,0.16);
      border-top-color: rgba(255,255,255,0.9);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-submit:focus-visible,
    .auth-google-btn:focus-visible {
      outline: 2px solid rgba(255,255,255,0.4);
      outline-offset: 2px;
    }

    #googleButtonContainer {
      width: 100%; display: flex; justify-content: center;
      min-height: 36px;
    }


    /* ─── Toggle Link ─── */
    .auth-toggle {
      text-align: center;
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      color: var(--text-tertiary);
      margin-top: clamp(10px, 1.4vh, 16px);
    }
    .auth-toggle button {
      background: none; border: none;
      color: var(--text-secondary);
      font-family: inherit;
      font-size: clamp(0.75rem, 1vw, 0.85rem);
      font-weight: 500;
      cursor: pointer;
      padding: 2px 4px;
      position: relative;
      transition: color 0.2s var(--smooth);
    }
    .auth-toggle button:hover {
      color: var(--text);
      transform: translateY(-1px);
    }

    /* ─── Right Panel ─── */
    .auth-right {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #fff;
      animation: fadeIn 0.6s var(--bounce) both 0.1s;
    }
    .auth-right::before {
      content: ''; position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(0,0,0,0.025) 0%, transparent 60%),
        radial-gradient(ellipse 30% 20% at 80% 20%, rgba(0,0,0,0.015) 0%, transparent 50%);
      pointer-events: none;
    }

    .auth-carousel {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 520px;
      background: rgba(0,0,0,0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 16px;
      padding: 14px 14px 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
      perspective: 1400px;
      overflow: hidden;
      isolation: isolate;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      transform: perspective(1400px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) scale(var(--cs, 1));
      transition: transform 0.45s var(--smooth), box-shadow 0.45s var(--smooth), border-color 0.45s var(--smooth);
      will-change: transform;
    }
    .auth-carousel:hover {
      --cs: 1.012;
      box-shadow: 0 14px 44px rgba(0,0,0,0.32), inset 0 1px 0 rgba(255,255,255,0.07);
      border-color: rgba(0,0,0,0.14);
    }
    .auth-carousel.is-dragging {
      --cs: 0.995;
      cursor: grabbing;
      transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
    }
    .auth-carousel:active {
      cursor: grabbing;
    }
    .auth-carousel::after {
      content: '';
      position: absolute;
      inset: -40%;
      z-index: 4;
      background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,0.55) 50%, transparent 58%);
      transform: translateX(-70%) skewX(-8deg);
      opacity: 0;
      pointer-events: none;
    }
    .auth-carousel.sweep::after {
      animation: carouselSweep 0.85s var(--smooth) both;
    }
    @keyframes carouselSweep {
      0% { transform: translateX(-70%) skewX(-8deg); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateX(70%) skewX(-8deg); opacity: 0; }
    }
    .auth-carousel-progress {
      position: absolute;
      top: 0; left: 14px; right: 14px;
      height: 2px;
      z-index: 5;
      border-radius: 2px;
      background: rgba(0,0,0,0.07);
      overflow: hidden;
      pointer-events: none;
    }
    .auth-carousel-progress span {
      display: block;
      height: 100%;
      width: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, rgba(0,0,0,0.45), rgba(0,0,0,0.75));
      transform-origin: left center;
      transform: scaleX(0);
    }
    .auth-carousel-progress.run span {
      animation: carouselProgressFill 5s linear both;
    }
    .auth-carousel-progress.paused span {
      animation-play-state: paused;
    }
    @keyframes carouselProgressFill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .auth-carousel-viewport {
      overflow: hidden;
      border-radius: 10px;
    }
    .auth-carousel-track {
      display: flex;
      width: 100%;
      will-change: transform;
      transform: translate3d(0,0,0);
      transition: transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .auth-carousel.is-animating .auth-carousel-track {
      pointer-events: none;
    }
    .auth-carousel.is-animating .auth-carousel-track,
    .auth-carousel.is-animating .auth-carousel-slide {
      transition: none !important;
    }
    .auth-carousel.is-dragging .auth-carousel-track {
      transition: none !important;
    }
    .auth-carousel-slide {
      flex: 0 0 60%;
      min-width: 0;
      transform-origin: center center;
      will-change: transform, opacity, filter;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform: translate3d(0,0,0) scale(0.92);
      opacity: 0.35;
      filter: blur(3.5px) brightness(0.80) saturate(0.82);
      transition: transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1), opacity 0.65s cubic-bezier(0.22, 0.61, 0.36, 1), filter 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    .auth-carousel.is-dragging .auth-carousel-slide {
      transition: none;
    }
    .auth-carousel-slide svg {
      width: 100%; height: auto;
      display: block;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      transform: translate3d(0,0,0) scale(1);
      will-change: transform;
    }
    .auth-carousel-slide.active-slide {
      transform: translate3d(0,0,0) scale(1);
      opacity: 1;
      filter: blur(0) brightness(1) saturate(1);
      transition-duration: 0.7s;
    }
    .auth-carousel-slide.active-slide svg {
      box-shadow: 0 10px 32px rgba(0,0,0,0.4);
      animation: slideInnerPop 0.7s var(--smooth) both;
    }
    @keyframes slideInnerPop {
      0% { transform: scale(0.965) translateY(10px); }
      60% { transform: scale(1.004) translateY(-2px); }
      100% { transform: scale(1) translateY(0); }
    }
    .auth-carousel-slide.inactive-slide {
      transform: translate3d(0,0,0) scale(0.93);
      opacity: 0.4;
      filter: blur(3px) brightness(0.82) saturate(0.85);
    }
    .auth-carousel-slide.inactive-slide svg {
      box-shadow: 0 4px 18px rgba(0,0,0,0.24);
    }
    .auth-carousel-slide.exit-left {
      transform: translate3d(-26px,0,0) scale(0.9) rotateY(9deg);
    }
    .auth-carousel-slide.enter-right {
      transform: translate3d(26px,0,0) scale(0.9) rotateY(-9deg);
    }


    .auth-carousel-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 2px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      margin-bottom: 8px;
    }
    .auth-carousel-label-name {
      font-size: 0.6rem;
      font-weight: 600;
      color: rgba(0,0,0,0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      display: inline-block;
      min-width: 90px;
    }
    .auth-carousel-label-name.swap {
      animation: labelSwap 0.5s var(--smooth) both;
    }
    @keyframes labelSwap {
      0% { opacity: 0; transform: translateY(10px); filter: blur(5px); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }
    .auth-carousel-label-name span {
      color: rgba(0,0,0,0.15);
      font-weight: 400;
    }
    .auth-carousel-label-index {
      font-size: 0.55rem;
      color: rgba(0,0,0,0.12);
      font-family: var(--font-mono);
      display: inline-block;
      min-width: 32px;
      text-align: right;
    }
    .auth-carousel-label-index.swap {
      animation: labelSwap 0.5s var(--smooth) both;
    }
    .auth-carousel-dots {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(10,10,10,0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      pointer-events: auto;
    }
    .auth-carousel-dot {
      position: relative;
      width: 6px; height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,0.28);
      border: none;
      cursor: pointer;
      padding: 0;
      overflow: hidden;
      transition: width 0.45s var(--smooth), background 0.3s ease, transform 0.2s ease;
    }
    .auth-carousel-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: #fff;
      transform: scaleX(0);
      transform-origin: left center;
    }
    .auth-carousel-dot.active {
      width: 26px;
      background: rgba(255,255,255,0.22);
    }
    .auth-carousel-dot.active::before {
      animation: dotFill 5s linear both;
    }
    .auth-carousel-dots.paused .auth-carousel-dot.active::before {
      animation-play-state: paused;
    }
    @keyframes dotFill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    .auth-carousel-dot:hover {
      background: rgba(255,255,255,0.5);
      transform: scale(1.12);
    }
    .auth-carousel-dot:active {
      transform: scale(0.85);
    }
    .auth-carousel-arrow {
      position: absolute;
      top: 50%;
      z-index: 6;
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(10,10,10,0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-50%) scale(0.85);
      transition: opacity 0.3s ease, transform 0.3s var(--bounce), background 0.25s ease;
      pointer-events: none;
    }
    .auth-carousel:hover .auth-carousel-arrow {
      opacity: 1;
      transform: translateY(-50%) scale(1);
      pointer-events: auto;
    }
    .auth-carousel-arrow:hover {
      background: rgba(10,10,10,0.75);
      transform: translateY(-50%) scale(1.1);
    }
    .auth-carousel-arrow:active {
      transform: translateY(-50%) scale(0.9);
    }
    .auth-carousel-prev { left: 22px; }
    .auth-carousel-next { right: 22px; }

    /* Gradient overlay + quote at bottom */
    .auth-right-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 2;
      padding: 48px 32px 24px;
      background: linear-gradient(180deg, transparent 0%, rgba(255,255,255,0.5) 100%);
      text-align: center;
    }
    .auth-quote {
      font-size: 0.9rem;
      font-weight: 400;
      color: rgba(0,0,0,0.5);
      line-height: 1.5;
      max-width: 380px;
      margin: 0 auto;
    }
    .auth-quote-cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: rgba(0,0,0,0.3);
      margin-left: 2px;
      animation: blink 1s step-end infinite;
      vertical-align: text-bottom;
    }
    .auth-quote-cursor.done {
      animation: none;
      opacity: 0;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .auth-quote-author {
      font-size: 0.7rem;
      color: rgba(0,0,0,0.25);
      margin-top: 6px;
      font-style: normal;
      font-weight: 400;
    }

    /* --- Floating Badges --- */
    .auth-float-badge {
      position: absolute;
      z-index: 5;
      background: rgba(0,0,0,0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      opacity: 0;
      animation: badgeAppear 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                 badgeDrift 6s ease-in-out infinite 1s;
    }
    @keyframes badgeAppear {
      0% { opacity: 0; transform: translateY(8px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes badgeDrift {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .auth-float-badge svg {
      width: 10px; height: 10px;
      color: rgba(0,0,0,0.35);
    }
    .auth-float-badge span {
      font-size: 0.5rem;
      color: rgba(0,0,0,0.35);
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .auth-float-badge-1 {
      top: 10%; right: 7%;
      animation-delay: 1.5s, 0.5s;
    }
    .auth-float-badge-2 {
      bottom: 24%; left: 6%;
      animation-delay: 2s, 1.2s;
    }


    /* ─── Responsive ─── */
    @media (max-width: 820px) {
      .auth-grid { grid-template-columns: 1fr; }
      .auth-right { display: none; }
      .auth-left::after { display: none; }
    }
    @media (max-width: 440px) {
      .auth-left { padding: clamp(12px, 3vw, 20px); }
    }
    /* Safety net for very short viewports */
    @media (max-height: 640px) {
      .auth-heading { font-size: 1.2rem; }
      .auth-eyebrow { margin-bottom: 4px; }
      .auth-sub { margin-bottom: 8px; }
      .auth-card { padding: 14px 16px; }
      .auth-fields { gap: 6px; }
      .auth-brand { margin-bottom: 2px; }
      .auth-footer { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .auth-carousel-track,
      .auth-carousel-slide,
      .auth-carousel-slide svg,
      .auth-carousel,
      .auth-carousel-dot,
      .auth-carousel-progress span {
        transition: none;
        animation: none;
      }
      .auth-carousel::after {
        display: none;
      }
    }
  </style>
</head>

  <script>
    (function() {
      var isSignIn = true;
      var input = document.getElementById('loginNameInput');
      var nameBtn = document.getElementById('loginNameBtn');
      var heading = document.getElementById('authHeading');
      var sub = document.getElementById('authSub');
      var toggleText = document.getElementById('authToggle');

      document.addEventListener('DOMContentLoaded', function() {
        initGSI();

        // ─── Typewriter Effect ───
        var quoteText = "Your schedule awaits. The journey continues.";
        var twEl = document.getElementById('typewriterText');
        var cursorEl = document.getElementById('typewriterCursor');
        var charIndex = 0;

        function typeNextChar() {
          if (charIndex < quoteText.length) {
            twEl.textContent += quoteText[charIndex];
            charIndex++;
            // Speed varies: pause at commas and periods
            var delay = 60;
            var ch = quoteText[charIndex - 1];
            if (ch === '.' || ch === '!' || ch === '?') delay = 600;
            else if (ch === ',' || ch === ';') delay = 300;
            setTimeout(typeNextChar, delay);
          } else {
            cursorEl.classList.add('done');
          }
        }
        // Start typing after a short delay
        setTimeout(typeNextChar, 600);

        // ─── Toggle Sign In / Sign Up ───
        function setBtnLabel(btn, text) {
          if (!btn) return;
          var label = btn.querySelector('.auth-submit-label, .auth-btn-label');
          if (label) label.textContent = text;
          else btn.textContent = text;
        }
        function animateSwap(el) {
          if (!el) return;
          el.classList.remove('auth-swap');
          void el.offsetWidth;
          el.classList.add('auth-swap');
        }
        function updateToggle() {
          var nameGroup = document.getElementById('loginNameGroup');
          if (isSignIn) {
            heading.innerHTML = 'Welcome <span class="hl-accent">back</span>';
            sub.textContent = 'Enter your email and password to sign in';
            setBtnLabel(nameBtn, 'Sign In');
            toggleText.innerHTML = "Don't have an account? <button id='authToggleBtn'>Sign up</button>";
            if (nameGroup) nameGroup.style.display = 'none';
          } else {
            heading.innerHTML = 'Create your <span class="hl-accent">account</span>';
            sub.textContent = 'Enter your details to get started';
            setBtnLabel(nameBtn, 'Sign Up');
            toggleText.innerHTML = "Already have an account? <button id='authToggleBtn'>Sign in</button>";
            if (nameGroup) { nameGroup.style.display = 'block'; animateSwap(nameGroup); }
          }
          animateSwap(heading);
          animateSwap(sub);
        }

        // ─── Toggle via event delegation ───
        toggleText.addEventListener('click', function(e) {
          if (e.target.id === 'authToggleBtn') {
            isSignIn = !isSignIn;
            updateToggle();
          }
        });

        // ─── Input handling ───
        var emailInput = document.getElementById('loginEmailInput');
        var passInput = document.getElementById('loginPasswordInput');
        var nameInput = document.getElementById('loginNameInput');

        function syncInputState(input) {
          if (!input) return;
          var has = !!input.value.trim();
          input.classList.toggle('has-value', has);
          var group = input.closest('.auth-input-group');
          if (group) {
            var label = group.querySelector('.auth-label');
            if (label) label.classList.toggle('has-value', has);
          }
        }
        function shakeInput(input) {
          if (!input) return;
          input.classList.remove('invalid');
          void input.offsetWidth;
          input.classList.add('invalid');
          input.addEventListener('animationend', function h() {
            input.classList.remove('invalid');
            input.removeEventListener('animationend', h);
          });
        }
        function updateBtn() {
          var valid = emailInput.value.trim() && passInput.value.length >= 6;
          if (!isSignIn) valid = valid && nameInput.value.trim();
          nameBtn.disabled = !valid;
        }
        updateBtn();
        emailInput.addEventListener('input', function() { updateBtn(); syncInputState(emailInput); });
        passInput.addEventListener('input', function() { updateBtn(); syncInputState(passInput); });
        nameInput.addEventListener('input', function() { updateBtn(); syncInputState(nameInput); });
        syncInputState(emailInput); syncInputState(passInput);

        function handleKeydown(e) {
          if (e.key === 'Enter' && !nameBtn.disabled) goLocal();
        }
        emailInput.addEventListener('keydown', handleKeydown);
        passInput.addEventListener('keydown', handleKeydown);
        nameInput.addEventListener('keydown', handleKeydown);
        nameBtn.addEventListener('click', goLocal);

        function goLocal() {
          var email = document.getElementById('loginEmailInput').value.trim();
          var password = document.getElementById('loginPasswordInput').value;
          var name = document.getElementById('loginNameInput').value.trim();
          if (!email || !password) { showToast('Please enter email and password', 'error'); shakeInput(document.getElementById('loginEmailInput')); return; }
          if (password.length < 6) { showToast('Password must be at least 6 characters', 'error'); shakeInput(document.getElementById('loginPasswordInput')); return; }
          nameBtn.disabled = true;
          nameBtn.classList.add('loading');
          setBtnLabel(nameBtn, isSignIn ? 'Signing in…' : 'Creating account…');

          if (isSignIn) {
            firebase.auth().signInWithEmailAndPassword(email, password).then(function(result) {
              var fbUser = result.user;
              var fbName = fbUser.displayName || email.split('@')[0];
              if (typeof googleSignIn === 'function') {
                googleSignIn({ name: fbName, email: email, picture: fbUser.photoURL || '', googleId: fbUser.uid });
              } else {
                createLocalProfile(fbName);
              }
            }).catch(function(error) {
              nameBtn.disabled = false;
              nameBtn.classList.remove('loading');
              setBtnLabel(nameBtn, 'Sign In');
              if (error.code === 'auth/user-not-found') { showToast('No account found with this email', 'error'); shakeInput(document.getElementById('loginEmailInput')); }
              else if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') { showToast('Incorrect email or password', 'error'); shakeInput(document.getElementById('loginPasswordInput')); }
              else if (error.code === 'auth/invalid-email') { showToast('Invalid email address', 'error'); shakeInput(document.getElementById('loginEmailInput')); }
              else showToast('Sign in failed: ' + (error.message || 'unknown error'), 'error');
            });
          } else {
            var displayName = name || email.split('@')[0];
            firebase.auth().createUserWithEmailAndPassword(email, password).then(function(result) {
              var fbUser = result.user;
              return fbUser.updateProfile({ displayName: displayName }).then(function() {
                if (typeof googleSignIn === 'function') {
                  googleSignIn({ name: displayName, email: email, picture: fbUser.photoURL || '', googleId: fbUser.uid });
                } else {
                  createLocalProfile(displayName);
                }
              });
            }).catch(function(error) {
              nameBtn.disabled = false;
              nameBtn.classList.remove('loading');
              setBtnLabel(nameBtn, 'Sign Up');
              if (error.code === 'auth/email-already-in-use') showToast('This email is already registered', 'error');
              else if (error.code === 'auth/weak-password') { showToast('Password is too weak (min 6 characters)', 'error'); shakeInput(document.getElementById('loginPasswordInput')); }
              else if (error.code === 'auth/invalid-email') { showToast('Invalid email address', 'error'); shakeInput(document.getElementById('loginEmailInput')); }
              else showToast('Sign up failed: ' + (error.message || 'unknown error'), 'error');
            });
          }
        }


        var track = document.getElementById('carouselTrack');
        var carouselEl = document.getElementById('authCarousel');
        var allSlides = track ? Array.prototype.slice.call(track.children) : [];
        var dots = document.querySelectorAll('.auth-carousel-dot');
        var dotsWrap = document.getElementById('carouselDots');
        var progressWrap = document.getElementById('carouselProgress');
        var labelEl = document.getElementById('carouselLabel');
        var idxEl = document.getElementById('carouselIndex');
        var prevBtn = document.getElementById('carouselPrev');
        var nextBtn = document.getElementById('carouselNext');
        var slideCount = 7;
        var currentSlide = 0;
        var autoInterval = null;
        var animRaf = null;
        var CAROUSEL_INTERVAL = 5000;
        var TRACK_DURATION = 950;
        var REAL_SLIDE_COUNT = 6;
        var names = ['Schedule', 'Hub', 'Finance', 'Analytics', 'Goals', 'Activities'];
        var SLIDE_PITCH = 60;
        var reducedMotion = false;
        function centerX(i) { return i * SLIDE_PITCH - (100 - SLIDE_PITCH) / 2; }

        function easeInOutQuint(t) {
          t = Math.min(Math.max(t, 0), 1);
          return t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2;
        }

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function stopAnim() {
          if (animRaf) { cancelAnimationFrame(animRaf); animRaf = null; }
          if (carouselEl) carouselEl.classList.remove('is-animating');
        }

        function applySlideStates(index) {
          allSlides.forEach(function(s, i) {
            var active = i === index;
            s.classList.toggle('active-slide', active);
            s.classList.toggle('inactive-slide', !active);
            s.classList.remove('exit-left', 'enter-right');
            s.style.transform = '';
            s.style.opacity = '';
            s.style.filter = '';
          });
        }

        function updateDragFx(offsetPct) {
          var viewCX = offsetPct + 50;
          allSlides.forEach(function(s, i) {
            var dist = Math.abs((i * SLIDE_PITCH + SLIDE_PITCH / 2) - viewCX) / SLIDE_PITCH;
            if (dist > 1.4) return;
            var sc = 1 - Math.min(dist * 0.12, 0.16);
            var op = 1 - Math.min(dist * 0.65, 0.65);
            s.style.transform = 'translate3d(0,0,0) scale(' + sc.toFixed(3) + ')';
            s.style.opacity = op.toFixed(3);
            s.style.filter = dist < 0.5 ? '' : 'blur(' + Math.min(dist * 3.5, 3.5).toFixed(1) + 'px) brightness(0.82) saturate(0.88)';
          });
        }

        function restartProgress() {
          if (progressWrap) {
            progressWrap.classList.remove('run');
            void progressWrap.offsetWidth;
            progressWrap.classList.remove('paused');
            if (autoInterval) progressWrap.classList.add('run');
          }
          if (dotsWrap) {
            dotsWrap.classList.remove('paused');
            void dotsWrap.offsetWidth;
          }
        }

        function pauseProgress() {
          if (progressWrap) progressWrap.classList.add('paused');
          if (dotsWrap) dotsWrap.classList.add('paused');
        }

        function triggerSweep() {
          if (!carouselEl || reducedMotion) return;
          carouselEl.classList.remove('sweep');
          void carouselEl.offsetWidth;
          carouselEl.classList.add('sweep');
        }

        function updateMeta(index) {
          var dotIndex = ((index % REAL_SLIDE_COUNT) + REAL_SLIDE_COUNT) % REAL_SLIDE_COUNT;
          dots.forEach(function(d, i) {
            d.classList.toggle('active', i === dotIndex);
          });
          if (dotsWrap) {
            dotsWrap.classList.remove('paused');
            void dotsWrap.offsetWidth;
          }
          if (labelEl) {
            labelEl.textContent = names[dotIndex];
            labelEl.classList.remove('swap');
            void labelEl.offsetWidth;
            labelEl.classList.add('swap');
          }
          if (idxEl) {
            idxEl.textContent = (dotIndex + 1) + ' / ' + REAL_SLIDE_COUNT;
            idxEl.classList.remove('swap');
            void idxEl.offsetWidth;
            idxEl.classList.add('swap');
          }
        }

        function setTrack(xPct) {
          track.style.transform = 'translate3d(' + (-xPct) + '%,0,0)';
        }

        function goToSlide(index, instant) {
          if (index < 0) index = REAL_SLIDE_COUNT - 1;
          if (index >= slideCount) index = 0;

          var fromIndex = currentSlide;
          stopAnim();
          updateMeta(index);

          if (instant || reducedMotion || fromIndex === index) {
            setTrack(centerX(index));
            currentSlide = index;
            applySlideStates(index);
            if (index === slideCount - 1) {
              setTrack(centerX(0));
              currentSlide = 0;
              applySlideStates(0);
              updateMeta(0);
            }
            return;
          }

          if (carouselEl) carouselEl.classList.add('is-animating');
          triggerSweep();
          
          var fromX = centerX(fromIndex);
          var toX = centerX(index);
          
          allSlides[fromIndex].classList.add(index > fromIndex ? 'exit-left' : 'enter-right');
          allSlides[index].classList.add(index > fromIndex ? 'enter-right' : 'exit-left');

          var start = performance.now();
          setTrack(fromX);
          
          (function step(now) {
            var t = Math.min((now - start) / TRACK_DURATION, 1);
            var e = easeInOutQuint(t);
            var currentX = fromX + (toX - fromX) * e;
            setTrack(currentX);
            updateDragFx(currentX);
            if (t < 1) {
              animRaf = requestAnimationFrame(step);
            } else {
              animRaf = null;
              currentSlide = index;
              applySlideStates(index);
              if (carouselEl) carouselEl.classList.remove('is-animating');
              if (index === slideCount - 1) {
                setTimeout(function() { goToSlide(0, true); }, 40);
              }
            }
          })(start);
        }

        function nextSlide() {
          restartProgress();
          goToSlide(currentSlide + 1 >= slideCount ? 0 : currentSlide + 1);
        }
        function prevSlide() { goToSlide(currentSlide - 1 < 0 ? REAL_SLIDE_COUNT - 1 : currentSlide - 1); }

        function startAutoRotate() {
          if (autoInterval) clearInterval(autoInterval);
          autoInterval = setInterval(nextSlide, CAROUSEL_INTERVAL);
          restartProgress();
        }

        function pauseAuto() {
          if (autoInterval) { clearInterval(autoInterval); autoInterval = null; }
          stopAnim();
          pauseProgress();
        }

        if (track) {
          var firstSlide = track.querySelector('.auth-carousel-slide');
          var clone = firstSlide.cloneNode(true);
          track.appendChild(clone);
          allSlides = Array.prototype.slice.call(track.children);

          goToSlide(0, true);
          startAutoRotate();

          dots.forEach(function(dot) {
            dot.addEventListener('click', function(ev) {
              ev.stopPropagation();
              pauseAuto();
              goToSlide(parseInt(this.getAttribute('data-index'), 10));
              startAutoRotate();
            });
          });
          if (prevBtn) prevBtn.addEventListener('click', function(ev) { ev.stopPropagation(); pauseAuto(); prevSlide(); startAutoRotate(); });
          if (nextBtn) nextBtn.addEventListener('click', function(ev) { ev.stopPropagation(); pauseAuto(); nextSlide(); startAutoRotate(); });

          document.addEventListener('keydown', function(e) {
            if (!carouselEl || !carouselEl.offsetParent) return;
            if (e.key === 'ArrowRight') { pauseAuto(); nextSlide(); startAutoRotate(); }
            else if (e.key === 'ArrowLeft') { pauseAuto(); prevSlide(); startAutoRotate(); }
          });
          document.addEventListener('visibilitychange', function() {
            if (document.hidden) { if (autoInterval) { clearInterval(autoInterval); autoInterval = null; } pauseProgress(); }
            else if (!autoInterval && !window.__carouselDragging) startAutoRotate();
          });

          window.__carouselDragging = false;
          (function() {
            var carousel = carouselEl || document.querySelector('.auth-carousel');
            if (!carousel || !track) return;
            var dragStartX = 0;
            var dragStartY = 0;
            var dragDelta = 0;
            var dragVel = 0;
            var lastX = 0;
            var lastT = 0;
            var baseOffset = 0;
            var maxOffset = centerX(slideCount - 1);
            var SWIPE_THRESHOLD = 45;
            var VELOCITY_THRESHOLD = 0.5;
            var VERTICAL_LOCK = 12;
            var locked = false;
            var directionLocked = false;
            var isAnimating = false;

            function getPointerX(e) {
              return e.touches ? e.touches[0].clientX : e.clientX;
            }
            function getPointerY(e) {
              return e.touches ? e.touches[0].clientY : e.clientY;
            }
            function readOffset() {
              var m = /translate3d\((-?[\d.]+)%/.exec(track.style.transform);
              return m ? -parseFloat(m[1]) : centerX(currentSlide);
            }
            function onStart(e) {
              if (e.touches && e.touches.length > 1) return;
              if (isAnimating) {
                stopAnim();
                track.style.transition = 'none';
                track.offsetHeight;
                track.style.transition = '';
              }
              window.__carouselDragging = true;
              locked = false;
              directionLocked = false;
              dragStartX = getPointerX(e);
              dragStartY = getPointerY(e);
              lastX = dragStartX;
              lastT = performance.now();
              dragDelta = 0;
              dragVel = 0;
              stopAnim();
              baseOffset = readOffset();
              carousel.classList.add('is-dragging');
              if (autoInterval) { clearInterval(autoInterval); autoInterval = null; }
              pauseProgress();
            }
            function onMove(e) {
              if (!window.__carouselDragging) return;
              var px = getPointerX(e);
              var py = getPointerY(e);
              var dx = px - dragStartX;
              var dy = py - dragStartY;
              if (!directionLocked) {
                if (Math.abs(dx) > VERTICAL_LOCK || Math.abs(dy) > VERTICAL_LOCK) {
                  directionLocked = true;
                  locked = Math.abs(dy) > Math.abs(dx);
                  if (locked) { window.__carouselDragging = false; carousel.classList.remove('is-dragging'); return; }
                } else if (Math.abs(dx) < 3) return;
              }
              if (locked) return;
              if (e.cancelable) e.preventDefault();
              var now = performance.now();
              dragVel = 0.65 * dragVel + 0.35 * ((px - lastX) / Math.max(now - lastT, 1) * 16);
              lastX = px;
              lastT = now;
              dragDelta = dx;
              var pct = dragDelta / carousel.offsetWidth * 100;
              var offset = baseOffset - pct;
              
              var nearestIndex = Math.round((offset + (100 - SLIDE_PITCH) / 2) / SLIDE_PITCH);
              var nearestC = centerX(nearestIndex);
              var diff = offset - nearestC;
              var resistance = 0.3;
              if (offset < centerX(0)) {
                offset = nearestC + diff * resistance;
              } else if (offset > maxOffset) {
                offset = nearestC + diff * resistance;
              }
              
              setTrack(offset);
              updateDragFx(offset);
              if (!reducedMotion) carousel.style.setProperty('--ry', Math.max(-8, Math.min(8, dragDelta / 24)) + 'deg');
            }
            function onEnd() {
              if (!window.__carouselDragging) return;
              window.__carouselDragging = false;
              carousel.classList.remove('is-dragging');
              carousel.style.setProperty('--ry', '0deg');
              if (locked) { startAutoRotate(); return; }
              
              var flick = Math.abs(dragVel) > VELOCITY_THRESHOLD;
              var snapTarget = currentSlide;
              var absDelta = Math.abs(dragDelta);
              
              if (dragDelta < 0 && (absDelta > SWIPE_THRESHOLD || (flick && absDelta > 15))) {
                snapTarget = currentSlide >= slideCount - 1 ? 0 : currentSlide + 1;
              } else if (dragDelta > 0 && (absDelta > SWIPE_THRESHOLD || (flick && absDelta > 15))) {
                snapTarget = currentSlide <= 0 ? REAL_SLIDE_COUNT - 1 : currentSlide - 1;
              }
              
              isAnimating = true;
              goToSlide(snapTarget);
              isAnimating = false;
              startAutoRotate();
            }
            carousel.addEventListener('mousedown', onStart);
            carousel.addEventListener('touchstart', onStart, { passive: true });
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
            carousel.addEventListener('dragstart', function(e) { e.preventDefault(); });

            if (!reducedMotion && window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
              var tiltRaf = null;
              var tiltTargetRX = 0, tiltTargetRY = 0, currentRX = 0, currentRY = 0;
              carousel.addEventListener('mousemove', function(e) {
                if (window.__carouselDragging) return;
                if (tiltRaf) return;
                tiltRaf = requestAnimationFrame(function() {
                  tiltRaf = null;
                  var r = carousel.getBoundingClientRect();
                  var nx = (e.clientX - r.left) / r.width - 0.5;
                  var ny = (e.clientY - r.top) / r.height - 0.5;
                  tiltTargetRY = (-nx * 6).toFixed(2);
                  tiltTargetRX = (ny * 5).toFixed(2);
                });
              });
              function animateTilt() {
                currentRX += (tiltTargetRX - currentRX) * 0.18;
                currentRY += (tiltTargetRY - currentRY) * 0.18;
                carousel.style.setProperty('--rx', currentRX.toFixed(2) + 'deg');
                carousel.style.setProperty('--ry', currentRY.toFixed(2) + 'deg');
                if (Math.abs(tiltTargetRX - currentRX) > 0.01 || Math.abs(tiltTargetRY - currentRY) > 0.01) {
                  requestAnimationFrame(animateTilt);
                }
              }
              carousel.addEventListener('mouseenter', function() {
                if (!tiltRaf) animateTilt();
              });
              carousel.addEventListener('mouseleave', function() {
                tiltTargetRX = 0;
                tiltTargetRY = 0;
              });
            }
          })();

          var carousel = carouselEl || document.querySelector('.auth-carousel');
          if (carousel) {
            carousel.addEventListener('mouseenter', function() {
              if (dotsWrap) dotsWrap.classList.remove('paused');
              if (progressWrap) progressWrap.classList.remove('paused');
            });
            carousel.addEventListener('mouseleave', function() {
              if (!window.__carouselDragging && !autoInterval) startAutoRotate();
            });
          }
        }
        // ─── Initialize Firebase Auth Google Sign-In ───
        initFirebaseGoogle();
      });

      function initFirebaseGoogle() {
        var googleBtn = document.getElementById('loginGoogleBtn');
        var guestBtn = document.getElementById('loginGuestBtn');
        if (!googleBtn) return;
        if (typeof firebase !== 'undefined' && typeof FIREBASE_CONFIG !== 'undefined' && !firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        googleBtn.addEventListener('click', function(e) {
          e.preventDefault();
          if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
            showToast('Firebase SDK not loaded. Refresh the page.', 'error');
            return;
          }
          var provider = new firebase.auth.GoogleAuthProvider();
          provider.addScope('profile');
          provider.addScope('email');
          googleBtn.classList.add('loading');
          firebase.auth().signInWithPopup(provider).then(function(result) {
            var user = result.user;
            if (!user) { showToast('Google sign-in failed', 'error'); return; }
            var gdata = {
              name: user.displayName || '',
              email: user.email || '',
              picture: user.photoURL || '',
              googleId: user.uid || ''
            };
            if (typeof googleSignIn === 'function') {
              googleSignIn(gdata);
            } else if (typeof createLocalProfile === 'function') {
              createLocalProfile(gdata.name || gdata.email.split('@')[0] || 'Google User');
            }
          }).catch(function(error) {
            googleBtn.classList.remove('loading');
            if (error.code === 'auth/popup-closed-by-user') return;
            console.error('Firebase Google sign-in error:', error);
            showToast('Google sign-in failed: ' + (error.message || 'unknown error'), 'error');
          });
        });

        // ─── Anonymous / Guest sign-in ───
        if (guestBtn) {
          guestBtn.addEventListener('click', function(e) {
            e.preventDefault();
            if (typeof firebase === 'undefined' || typeof firebase.auth !== 'function') {
              showToast('Firebase SDK not loaded. Refresh the page.', 'error');
              return;
            }
            guestBtn.classList.add('loading');
            firebase.auth().signInAnonymously().then(function(result) {
              var user = result.user;
              if (!user) { showToast('Guest sign-in failed', 'error'); return; }
              sessionStorage.setItem('haven-guest', '1');
              if (typeof createLocalProfile === 'function') {
                createLocalProfile(user.uid ? 'Guest' : 'Guest');
              }
            }).catch(function(error) {
              guestBtn.classList.remove('loading');
              console.error('Firebase anonymous sign-in error:', error);
              showToast('Guest sign-in failed: ' + (error.message || 'unknown error'), 'error');
            });
          });
        }
      }

    })();
  </script>
</body>
</html>
